[project]
name = "flower"
version = "0.1.0"
description = "Flow-attention memory experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    # torch 2.10+ ships CUDA-13-bundled wheels (the default manylinux wheel is
    # now CUDA 13; the separate cu128/cu130 index scheme was dropped). The local
    # RTX 5090 runs driver 610.88 (CUDA 13.3), so torch 2.13 is the target. On
    # older vast hosts that only have CUDA 12.8, fall back to torch 2.9+cu128.
    "torch>=2.10",
    "tqdm>=4.66",
    "datasets>=2.18",
    "transformers>=4.40",
    "tensorboard>=2.16",
    "flash-linear-attention==0.5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
    ".claude",
    ".codex",
    "data_cache",
    "runs",
    "tokenizers",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["flower", "scripts", "tests"]
exclude = [
    ".claude",
    ".codex",
    "data_cache",
    "runs",
    "tokenizers",
]

[tool.setuptools.packages.find]
include = ["flower*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "torchao>=0.17.0",
    "ty>=0.0.37",
]
