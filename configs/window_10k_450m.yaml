# Window 512 at production horizon — the decision run.
#
# WHY
#   The equal-wall-clock advantage of window 512 is DECAYING with horizon:
#       1500 steps   -0.06193 val_bpb
#       4000 steps   -0.02388 val_bpb   (61% smaller)
#   Production runs are 10k steps. Two points cannot distinguish "decaying
#   toward zero", "asymptoting near -0.02", or "heading negative" — and those
#   imply three different decisions. This run is the third point, at the
#   horizon that actually matters.
#
# WHAT IS ALREADY SETTLED AND NOT BEING RE-ASKED
#   - The optimum window is 512: 2048 -> 1024 -> 512 -> 256 turns back up at 256
#     (docs/profiling/window_screen_results.md, Q1).
#   - The throughput edge is real and durable: 1.196x measured in-run, 1.238x on
#     the synthetic bench (clean box, 0.7% spread). It does NOT decay with
#     horizon the way the quality edge does.
#
# WHY IT IS WORTH 23 HOURS EVEN IF QUALITY GOES NEUTRAL
#   At quality parity, window 512 still reaches the same loss ~20% faster, which
#   applies to every future run on this box. The run is therefore not "does 512
#   win" but "does 512 ever LOSE" — the failure mode that would rule it out is
#   the decay continuing past zero into positive territory.
#
# ISO-TIME SIZING
#   10000 x 1.196 = 11960 steps, using the IN-RUN ratio (56,549-class synthetic
#   bench numbers overstate it slightly; the real training ratio was 1.196x from
#   runs/window_screen_450m). Each arm gets a complete WSD schedule for its own
#   step count, so neither is caught mid-decay.
#
#   Note the 4k pair ran under CPU contention and the short-window arm actually
#   received 10.8%% LESS wall-clock than the control, making -0.02388 a
#   conservative lower bound. This run should be on an idle box; check the
#   realised tok/s of both arms before interpreting.
#
# LAUNCH
#   nohup bash scripts/queue_window_10k.sh > runs_queue_window_10k.log 2>&1 &

sweep:
  name: window_10k_450m

  defaults:
    data:
      dataset: fineweb_edu
      tokenizer: "custom:tokenizers/fineweb_16k.json"
      sequence_length: 8192
      eval_seq_len: 8192
      bytes_per_token: 4.279

    training:
      batch_size: 2
      gradient_accumulation_steps: 16
      eval_batch_size: 1
      steps: 1500
      lr: 0.0025
      warmup_steps: 500
      lr_schedule: wsd
      lr_decay_frac: 0.2
      lr_final_frac: 0.0
      grad_clip: 1.0
      log_interval: 25
      eval_interval: 500
      checkpoint_interval: 100000
      save_checkpoints: false
      device: auto
      seed: 0
      seeds: [0]
      log_backend: tensorboard
      composite_eval: false
      optimizer: muon
      ema_decay: 0.997
      muon_lr: 0.002
      muon_momentum: 0.95
      weight_decay: 0.01
      weight_decay_exclude_embeddings: true
      validation_steps: 30
      validation_interval: 500
      vram_fraction: 0.95
      precision: bf16
      compile_model: true
      compile_mode: max-autotune-no-cudagraphs
      # FP8 stack fixed across every arm, matching muon_screen_450m and
      # comp_muon_screen_450m so all three screens are mutually comparable.
      fp8_linear: true
      fp8_recipe: tensorwise
      fp8_keep_bf16_blocks: 1


  variants:
    - name: w2048_10k
      model: &vanilla_450m
        variant: vanilla_local
        vocab_size: 16384
        d_model: 1280
        num_heads: 20
        num_layers: 20
        ffn_dim: 5120
        max_seq_len: 8192
        local_window: 2048
        rope_base: 10000.0
        dropout: 0.0
        norm_type: rmsnorm
        ffn_activation: swiglu
        ffn_param_match: true
        qk_norm: true
        use_bias: false
        init_scheme: scaled
        init_std: 0.02
        bf16_cross_entropy: true
        flex_attention: true
        fused_linear_ce: true
      training:
        steps: 10000

    - name: w512_10k_isotime
      model:
        <<: *vanilla_450m
        local_window: 512
      training:
        steps: 11960
