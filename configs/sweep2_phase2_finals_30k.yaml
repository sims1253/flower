# Sweep 2 — Phase 2 redo at true 30k steps on RTX 5090 (32GB)
#
# Original Phase 2 ran 7500 steps despite the "_30k" suffix — back-off after
# silent SIGKILL on larger batches. This config redoes all 5 finals on the
# 5090 at 30k steps, batch=128 (5090 limit). Token budget per trial:
# 30000 * 128 * 512 = ~1.97B tokens (vs the original target of ~3.94B at
# batch=256). Frequent checkpoints so displacement-resume just works.

sweep:
  name: sweep2_phase2_finals_30k
  defaults:
    data:
      dataset: fineweb-edu
      tokenizer: "custom:tokenizers/fineweb_4k.json"
      sequence_length: 512
      streaming: true
    training:
      batch_size: 128
      steps: 30000
      lr: 0.000283        # 4e-4 / sqrt(2) — sqrt-rule scaling for halved batch.
      warmup_steps: 1000
      validation_interval: 5000
      grad_clip: 1.0
      device: auto
      log_backend: tensorboard
      validation_steps: 200
      optimizer: adamw
      memory_lr: 0.0
      save_checkpoints: true
      checkpoint_interval: 2500
    model:
      vocab_size: 4096
      d_model: 384
      num_heads: 6
      num_layers: 6
      ffn_dim: 1536
      max_seq_len: 512
      local_window: 64
      memory_slots: 12
      short_memory_slots: 4
      flow_steps: 3
      phase_memory_dim: 64
  variants:
  - name: p2_hier_max_rbf_local_adamw_30k
    training:
      optimizer: adamw
    model:
      variant: summary_memory
      hierarchical_memory: true
      memory_aggregation: max
      local_attn_kernel_bias: rbf
  - name: p2_hier_max_adamw_30k
    training:
      optimizer: adamw
    model:
      variant: summary_memory
      hierarchical_memory: true
      memory_aggregation: max
  - name: p2_hier_max_16slots_adamw_30k
    training:
      optimizer: adamw
    model:
      variant: summary_memory
      hierarchical_memory: true
      memory_aggregation: max
      memory_slots: 16
  - name: p2_hier_max_32slots_adamw_30k
    training:
      optimizer: adamw
    model:
      variant: summary_memory
      hierarchical_memory: true
      memory_aggregation: max
      memory_slots: 32
  - name: p2_hier_orthogonal_adamw_30k
    training:
      optimizer: adamw
    model:
      variant: summary_memory
      hierarchical_memory: true
      memory_aggregation: orthogonal
