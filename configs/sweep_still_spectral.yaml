# Spectral compactor sweep: test wiki-inspired spectral compression idea
# Key insight: KV keys have only 3-4% effective dimensions (SpectralQuant)
# Our spectral compactor learns signal subspaces and compresses in spectral domain

sweep:
  name: sweep_still_spectral

  defaults:
    model:
      vocab_size: 4096
      d_model: 384
      num_heads: 6
      num_layers: 6
      ffn_dim: 1536
      max_seq_len: 1024
      local_window: 256
      rope_base: 10000.0
      dropout: 0.0
      still_compact_len: 64
      still_num_blocks: 2
      still_d_latent: 128
      still_kl_topk: 200
      still_kl_weight: 1.0
      still_ce_weight: 0.1
      still_compact_from_step: 1500
      still_kl_temperature: 1.0
      still_base_warmup_steps: 1500

    data:
      dataset: fineweb_edu
      tokenizer: "custom:tokenizers/fineweb_4k.json"
      sequence_length: 1024
      eval_seq_len: 1024

    training:
      batch_size: 64
      gradient_accumulation_steps: 1
      steps: 6500
      lr: 0.003
      warmup_steps: 200
      lr_schedule: linear_warmup
      grad_clip: 1.0
      eval_interval: 500
      checkpoint_interval: 1000
      save_checkpoints: true
      device: auto
      seed: 0
      seeds: [0, 1, 2, 3, 4]
      log_backend: tensorboard
      composite_eval: false
      optimizer: muon
      muon_lr: 0.003
      muon_momentum: 0.95

  variants:
    - name: spec_baseline
      model:
        variant: still
        still_compact_len: 64

    - name: spec_spectral
      model:
        variant: still_spectral
        still_compact_len: 64
        still_use_spectral: true

    - name: spec_freq
      model:
        variant: still_freq
        still_compact_len: 64
        still_use_freq_decay: true

    - name: spec_spectral_freq
      model:
        variant: still_spectral
        still_compact_len: 64
        still_use_spectral: true
        still_use_freq_decay: true
