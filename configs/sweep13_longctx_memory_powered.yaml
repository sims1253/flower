# Sweep 13, Long-Context Memory Bake-off — POWERED follow-up.
#
# Launch this ONLY if sweep13_longctx_memory_bakeoff.yaml shows directional
# signal (a memory arm beating vanilla_local at seq=8192). The directional pass
# runs 2 seeds and cannot resolve effects smaller than ~0.1 ppl; this config
# raises the seed count and step budget so the comparison that showed signal can
# actually be called significant.
#
# Same shape as the directional pass (d512/L8, seq=8192, window=2048) so the two
# are directly comparable; only seeds and steps change. Edit the `variants` list
# to the arms that looked promising (e.g. drop vanilla if it clearly lost, or
# keep it as the control). Measured fit: batch 8 = 22.3 GB peak, ~89k tok/s on
# torch 2.13 (batch 2 leaves most of the GPU idle; batch 16 OOMs); effective
# batch is held at 131072 tokens via accum 2. 3 arms x 4 seeds x 10000 steps.
#
# Launch:
#   PYTHONPATH=. uv run python -m flower.sweep \
#     --config configs/sweep13_longctx_memory_powered.yaml \
#     --output-dir runs/sweep13_longctx_powered

sweep:
  name: sweep13_longctx_memory_powered

  defaults:
    model:
      vocab_size: 16384
      d_model: 512
      num_heads: 8
      num_layers: 8
      ffn_dim: 2048
      max_seq_len: 8192
      local_window: 2048
      rope_base: 10000.0
      dropout: 0.0
      norm_type: rmsnorm
      ffn_activation: swiglu
      ffn_param_match: true
      qk_norm: true
      use_bias: false
      init_scheme: scaled
      init_std: 0.02
      bf16_cross_entropy: true     # CE in bf16 (doc S4)
      flex_attention: true
      memory_slots: 8

    data:
      dataset: fineweb_edu
      tokenizer: "custom:tokenizers/fineweb_16k.json"
      sequence_length: 8192
      eval_seq_len: 8192
      bytes_per_token: 4.279

    training:
      batch_size: 8
      gradient_accumulation_steps: 2
      steps: 10000
      lr: 0.003
      warmup_steps: 500
      lr_schedule: wsd
      lr_decay_frac: 0.2
      lr_final_frac: 0.0
      grad_clip: 1.0
      eval_interval: 500
      checkpoint_interval: 2000
      save_checkpoints: true
      device: auto
      seed: 0
      seeds: [0, 1, 2]
      log_backend: tensorboard
      composite_eval: false
      optimizer: muon
      muon_lr: 0.003
      muon_momentum: 0.95
      weight_decay: 0.01
      weight_decay_exclude_embeddings: true
      validation_steps: 50
      validation_interval: 500
      precision: bf16
      compile_model: true
      compile_mode: default

  variants:
    # Param-matched vanilla control: d640/L10 = 49.6M non-emb, within 8% of
    # bloom's 46.1M. The directional pass compared bloom (54.5M) against a
    # smaller vanilla (33.3M), so the bloom win could be capacity, not
    # mechanism. This arm isolates the mechanism by matching the param budget.
    - name: vanilla_matched54M
      model:
        variant: vanilla_local
        d_model: 640
        num_heads: 10
        num_layers: 10
        ffn_dim: 2560
    # The directional winner, unchanged. 54.5M, 46.1M non-emb.
    - name: bloom_memory
      model:
        variant: bloom_memory
        bloom_num_hashes: 4
        bloom_summary_points: 16
        bloom_temperature: 0.5
    # The smaller vanilla (33.3M) for continuity with the directional pass.
    - name: vanilla_local
      model: { variant: vanilla_local }
