# Sweep 2 — Phase 2: Top-K from Phase 1 at 30k steps
# AUTO-GENERATED by scripts/generate_phase2_config.py

sweep:
  name: sweep2_phase2_finals
  defaults:
    data:
      dataset: fineweb-edu
      tokenizer: custom:tokenizers/fineweb_4k.json
      sequence_length: 512
      streaming: true
    training:
      batch_size: 256        # back to Phase 1 batch — 384 and 512 silently crash (likely sysRAM, not VRAM).
      steps: 7500            # 3x Phase 1 step count for better convergence on headline numbers.
      lr: 0.0004             # match Phase 1 LR.
      warmup_steps: 500
      validation_interval: 2500
      grad_clip: 1.0
      device: auto
      log_backend: tensorboard
      validation_steps: 200
      optimizer: adamw
      memory_lr: 0.0
      save_checkpoints: true
      checkpoint_interval: 1000   # frequent enough that bid-displacement never costs >10 min of training.
    model:
      vocab_size: 4096
      d_model: 384
      num_heads: 6
      num_layers: 6
      ffn_dim: 1536
      max_seq_len: 512
      local_window: 64
      memory_slots: 12
      short_memory_slots: 4
      flow_steps: 3
      phase_memory_dim: 64
  variants:
  - name: p2_hier_max_rbf_local_adamw_30k
    training:
      optimizer: adamw
    model:
      variant: summary_memory
      hierarchical_memory: true
      memory_aggregation: max
      local_attn_kernel_bias: rbf
  - name: p2_hier_orthogonal_adamw_30k
    training:
      optimizer: adamw
    model:
      variant: summary_memory
      hierarchical_memory: true
      memory_aggregation: orthogonal
  - name: p2_hier_max_32slots_adamw_30k
    training:
      optimizer: adamw
    model:
      variant: summary_memory
      hierarchical_memory: true
      memory_aggregation: max
      memory_slots: 32
  - name: p2_hier_max_adamw_30k
    training:
      optimizer: adamw
    model:
      variant: summary_memory
      hierarchical_memory: true
      memory_aggregation: max
  - name: p2_hier_max_16slots_adamw_30k
    training:
      optimizer: adamw
    model:
      variant: summary_memory
      hierarchical_memory: true
      memory_aggregation: max
      memory_slots: 16
