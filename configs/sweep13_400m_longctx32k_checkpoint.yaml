# Sweep 13, 400M @ seq=32768 — the comfortable local scale-up for Section 13.
#
# 600M @ seq=32K fits but tight (27.5 GB peak, ~4.5 GB headroom — risky under
# WSL2 fragmentation). 400M @ seq=32K fits comfortably at 19.5 GB peak (12 GB
# headroom), leaving room for batch flexibility and the memory-mechanism arms
# (bloom/summary add ~17% params + their activations). 320M non-embedding core
# is solidly in the regime where docs/training-speedups.md §13 predicts memory-
# mechanism circuits can form (>500M ideal, but 320M is the practical local
# ceiling at seq=32K and far better than the 100M the prior configs managed).
#
# Enabled by FFN-only activation checkpointing (NEXT_IDEAS.md §10b): keeps
# attention (Q/K/V/O) live, checkpoints only the FFN. ~36% memory saving for
# ~16% throughput cost. Without it this config OOMs on the forward. Requires
# torch.compile (eager flex would materialize ~30GB of scores).
#
# Measured (RTX 5090, bf16, compile, flex, Muon, ffn-checkpoint): 19.5 GB peak.
# batch 1 x accum 8 = effective batch 262144 tokens.
#
# Launch:
#   PYTHONPATH=. FLOWER_DATA_CACHE=data_cache \
#     PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True uv run python -m flower.train \
#     --config configs/sweep13_400m_longctx32k_checkpoint.yaml \
#     --output-dir runs/sweep13_400m_longctx32k --device cuda

model:
  variant: vanilla_local
  vocab_size: 16384
  d_model: 1024
  num_heads: 16
  num_layers: 24
  ffn_dim: 4096             # SwiGLU hidden auto-matched to ~2730 (2/3 * 4096)
  max_seq_len: 32768
  local_window: 2048         # seq/window = 16x — deep in the memory-relevant regime
  rope_base: 10000.0
  dropout: 0.0
  norm_type: rmsnorm
  ffn_activation: swiglu
  ffn_param_match: true
  qk_norm: true
  use_bias: false
  init_scheme: scaled
  init_std: 0.02
  bf16_cross_entropy: true     # CE in bf16 (doc S4)
  flex_attention: true
  activation_checkpoint: "ffn"   # the enabler — keeps attn live, checkpoints FFN only

data:
  dataset: fineweb_edu
  tokenizer: "custom:tokenizers/fineweb_16k.json"
  sequence_length: 32768
  eval_seq_len: 32768
  bytes_per_token: 4.279

training:
  batch_size: 1
  gradient_accumulation_steps: 8   # effective batch 262144 tokens
  steps: 3000               # ~786M tokens
  lr: 0.002
  warmup_steps: 500
  lr_schedule: wsd
  lr_decay_frac: 0.2
  lr_final_frac: 0.0
  grad_clip: 1.0
  eval_interval: 500
  checkpoint_interval: 500
  save_checkpoints: true
  device: auto
  seed: 0
  log_backend: tensorboard
  composite_eval: false
  optimizer: muon
  muon_lr: 0.0018
  muon_momentum: 0.95
  weight_decay: 0.01
  weight_decay_exclude_embeddings: true
  validation_steps: 20
  validation_interval: 500
  precision: bf16
  compile_model: true
  compile_mode: default
