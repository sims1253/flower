# Sweep 7 Phase A — Sharpen the lens (discrimination gate).
#
# Purpose: prove the evaluation suite discriminates *known* variants before
# spending GPU on new architectures (Phase B). Three changes vs Sweep 5/6:
#   1. Fixed recipe: muon@lr3e-3 (Sweep 4 Phase 0 winner) instead of adamw.
#   2. eval_seq_len=4096 so probes run at >local_window context.
#   3. Multi-query MQAR probe (capacity curve) as primary metric.
#
# Variants: vanilla_local, hier_max_16, bloom_memory (known ranking test)
#           + hier_max_16_adamw (recipe-cost control arm, 3 seeds each).
#
# Seeds: each variant runs 3 seeds (0,1,2) via `--seeds 0,1,2` in the runner.
# Gate: suite passes iff MQAR breaking_point separates known variants with
#       non-overlapping mean±std across all 3 seeds.
sweep:
  name: sweep7_phase_a
  defaults:
    data:
      dataset: fineweb-edu
      tokenizer: "custom:tokenizers/fineweb_4k.json"
      sequence_length: 2048
      eval_seq_len: 4096
      streaming: true
    training:
      # Keep effective batch at 32, but avoid CUDA spilling into shared memory on
      # 32 GiB cards during long-context composite eval / memory variants.
      batch_size: 16
      gradient_accumulation_steps: 2
      steps: 10000
      lr_schedule: linear_warmup
      warmup_steps: 1000
      validation_interval: 2500
      validation_steps: 200
      checkpoint_interval: 5000
      save_checkpoints: true
      grad_clip: 1.0
      device: auto
      log_backend: tensorboard
      optimizer: muon
      muon_lr: 0.003
      muon_ns_steps: 5
      muon_momentum: 0.95
      memory_lr: 0.0
      seed: 0
      seeds: [0, 1, 2]
      composite_eval: true
    model:
      vocab_size: 4096
      d_model: 384
      num_heads: 6
      num_layers: 6
      ffn_dim: 1536
      max_seq_len: 2048
      local_window: 128
      rope_base: 10000.0
      memory_slots: 16
      short_memory_slots: 4
      hierarchical_memory: true
      memory_aggregation: max
      flow_steps: 3
  variants:
    # Known-ranking discrimination gate
    - name: vanilla_local
      model:
        variant: vanilla_local
        hierarchical_memory: false

    - name: hier_max_16
      model:
        variant: summary_memory
        hierarchical_memory: true
        memory_aggregation: max
        memory_slots: 16

    - name: bloom_memory
      model:
        variant: bloom_memory
        hierarchical_memory: false
        bloom_num_hashes: 4
        bloom_temperature: 0.5
        bloom_summary_points: 16

    # AdamW recipe-cost control arm (quantifies Sweep 5 recipe mistake)
    - name: hier_max_16_adamw
      training:
        optimizer: adamw
        lr: 0.000283
      model:
        variant: summary_memory
        hierarchical_memory: true
        memory_aggregation: max
        memory_slots: 16
