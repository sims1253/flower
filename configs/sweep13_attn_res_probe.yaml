# Sweep 13 — Depth-axis routing probe (AttnRes family) on the ~100M base.
#
# Orthogonal to the Still line of work rather than another compactor variant.
# Still compacts along the SEQUENCE axis; AttnRes retrieves along the DEPTH
# axis. Both address the same underlying limitation — a fixed-size state cannot
# preserve everything — from different directions, so a positive result here
# composes with the compaction results rather than competing with them.
#
# Two published fixes to Kimi K3's AttnRes are tested. This matters because
# plain AttnRes DEGRADES at scale (+6.9% ppl at 1044M, +6.6% at 7.6B), so the
# naive version is not worth running:
#
#   R1 delta_block / key=full     Delta Block AttnRes (arXiv:2605.18855).
#     Routes over block deltas (h_{b+1} - h_b) with additive routing instead of
#     cumulative states with replacement routing. Fixes routing collapse: max
#     softmax weight stays ~0.6 through depth vs ~0.2 for plain AttnRes.
#     Reference result: 220M/L=12 on FineWeb-Edu, 38.71 -> 37.08 ppl.
#
#   R2 delta_block / key=sliced   + S-LR-ATTNRES (arXiv:2607.09694).
#     Same routing, but the key is the last r dims of the value rather than the
#     full-width source. Depth routing discriminates among ~15 ordered sources,
#     not 1024 token positions, so it needs far fewer key dims. Reference: best
#     loss/FLOPs Pareto point, 3.25x less added compute than standard AttnRes.
#
# Added parameters are negligible at this scale (a per-site query and gate):
#   R1 ~ 7 sites x 768 + 7  = 5383    R2 ~ 7 sites x 64 + 7 = 455
# So this is close to a pure-mechanism test — any difference is routing, not
# capacity. The module is an exact identity at initialisation (zero-init gate),
# so R1/R2 start bit-identical to R0.
#
# Diagnostic to watch: `diagnostics/attn_res_max_weight_mean` in tensorboard is
# the routing-collapse metric from the delta paper. If it sits near 1/n_sources
# (~0.13 here) the router never learned to select and a null result means
# "routing collapsed", not "depth routing does not help".
#
#   uv run python -m flower.sweep --config configs/sweep13_attn_res_probe.yaml \
#     --output-dir runs/sweep13_attn_res_probe
#
# NOTE: attn_res is rejected under the still_* variants (StillLM re-implements
# the block loop for KV interception and would skip the router). This is a
# vanilla-base probe by construction.

sweep:
  name: sweep13_attn_res_probe

  defaults:
    model:
      variant: vanilla_local
      vocab_size: 16384
      d_model: 768
      num_heads: 12
      num_layers: 14
      ffn_dim: 3072
      max_seq_len: 1024
      local_window: 256
      rope_base: 10000.0
      dropout: 0.0
      norm_type: rmsnorm
      ffn_activation: swiglu
      ffn_param_match: true
      qk_norm: true
      use_bias: false
      init_scheme: scaled

    data:
      dataset: fineweb_edu
      tokenizer: "custom:tokenizers/fineweb_16k.json"
      sequence_length: 1024
      eval_seq_len: 1024
      # Measured (scripts/analyze_tokenizer.py). Enables val_bpb, which is the
      # only metric comparable against runs on a different tokenizer.
      bytes_per_token: 4.279

    training:
      batch_size: 16
      gradient_accumulation_steps: 4
      steps: 6000
      lr: 0.003
      warmup_steps: 300
      lr_schedule: wsd
      lr_decay_frac: 0.2
      grad_clip: 1.0
      eval_interval: 500
      checkpoint_interval: 2000
      save_checkpoints: true
      device: auto
      seed: 0
      seeds: [0, 1, 2, 3, 4]
      log_backend: tensorboard
      optimizer: muon
      muon_lr: 0.002
      muon_momentum: 0.95
      weight_decay: 0.01
      weight_decay_exclude_embeddings: true
      validation_steps: 20
      validation_interval: 500
      precision: bf16
      # Compile ON. It disables the module-diagnostics walk, so
      # `attn_res_max_weight` is NOT collected in these runs — but paying ~10
      # GPU-hours across 15 runs to log one scalar is the wrong trade. Get the
      # routing-collapse metric from a single extra uncompiled run instead:
      #
      #   uv run python -m flower.train --config configs/sweep13_attn_res_probe.yaml \
      #     --variant R1_delta_block_full --steps 2000 --seed 0 \
      #     --output-dir runs/attn_res_diag_R1        # then edit compile_model: false
      #
      # The metric is a property of the learned router, not of the seed, so one
      # run per routed arm is enough to tell "routing collapsed" from
      # "depth routing did not help".
      compile_model: true

  variants:
    - name: R0_baseline
      model: {}

    - name: R1_delta_block_full
      model:
        attn_res: delta_block
        attn_res_blocks: 8
        attn_res_key: full

    - name: R2_delta_block_sliced
      model:
        attn_res: delta_block
        attn_res_blocks: 8
        attn_res_key: sliced
        attn_res_rank: 64
