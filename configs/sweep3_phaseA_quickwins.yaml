# Sweep 3 — Phase A: Quick wins from Sweep 2 analysis
#
# Variants targeted at specific Sweep 2 findings. All on RTX 5090 (32GB).
# Default settings match Phase 2 30k for direct comparability: batch=128,
# lr=2.83e-4, 30k steps. Variants override batch/lr where needed.
#
# Findings → variants:
#   1. RBF #2 + 16slots #1 never tested together → s3_hier_max_16slots_rbf_30k
#   2. phase_memory was bad with AdamW @ 2500 (165) but BEST with Muon @ 2500
#      (58); untested at 30k → s3_phase_memory_adamw_30k
#   3. looped_x2 OOM'd at batch=128 on 32GB (78GB on 96GB cards) → retry at
#      batch=64 (lr sqrt-scaled to 2e-4) → s3_hier_max_looped_x2_b64_30k
#   4. fa_fm_fixed OOM'd at batch=128 on 32GB → retry at batch=64 →
#      s3_fa_fm_b64_30k
#   5. Muon NaN'd on every memory variant. Retry with muon_lr=1e-4
#      + longer warmup → s3_hier_max_muon_safer
#   6. dual_lr diverged at memory_lr=5e-4 (and 1e-3 originally). Try the
#      conservative end → s3_hier_max_dual_lr_safer (memory_lr=1e-4)

sweep:
  name: sweep3_phaseA_quickwins
  defaults:
    data:
      dataset: fineweb-edu
      tokenizer: "custom:tokenizers/fineweb_4k.json"
      sequence_length: 512
      streaming: true
    training:
      batch_size: 128
      steps: 30000
      lr: 0.000283
      warmup_steps: 1000
      validation_interval: 5000
      grad_clip: 1.0
      device: auto
      log_backend: tensorboard
      validation_steps: 200
      optimizer: adamw
      memory_lr: 0.0
      save_checkpoints: true
      checkpoint_interval: 2500
    model:
      vocab_size: 4096
      d_model: 384
      num_heads: 6
      num_layers: 6
      ffn_dim: 1536
      max_seq_len: 512
      local_window: 64
      memory_slots: 12
      short_memory_slots: 4
      flow_steps: 3
      phase_memory_dim: 64

  variants:
    # 1. Stack the two top Phase 2 winners. Both proven at 30k individually.
    - name: s3_hier_max_16slots_rbf_30k
      training: {optimizer: adamw}
      model:
        variant: summary_memory
        hierarchical_memory: true
        memory_aggregation: max
        memory_slots: 16
        local_attn_kernel_bias: rbf

    # 2. phase_memory + AdamW @ 30k. Sleeper-hit candidate.
    - name: s3_phase_memory_adamw_30k
      training: {optimizer: adamw}
      model:
        variant: phase_memory

    # 3. Looped x2 retry at batch=64 + sqrt-scaled lr. Tests if depth-for-free
    # beats 16slots once it actually fits.
    - name: s3_hier_max_looped_x2_b64_30k
      training:
        optimizer: adamw
        batch_size: 64
        lr: 0.0002    # 2.83e-4 / sqrt(2) — sqrt-rule from batch=128 baseline.
      model:
        variant: summary_memory
        hierarchical_memory: true
        memory_aggregation: max
        loop_count: 2

    # 4. fa_fm retry at batch=64. Phase 1 fa_fm was the original "kitchen sink"
    # (flow + memory). Bug was hidden_dim sized off flat_dim*2; fix made it 69M
    # but it still OOM'd at batch=128.
    - name: s3_fa_fm_b64_30k
      training:
        optimizer: adamw
        batch_size: 64
        lr: 0.0002
      model:
        variant: fa_fm

    # 5. Muon retry on the workhorse architecture, with safer hyperparameters
    # (3x lower LR + 2x longer warmup). If this works, Muon was 2-3x better
    # than AdamW on the variants where it didn't NaN.
    - name: s3_hier_max_muon_safer
      training:
        optimizer: muon
        muon_lr: 0.0001
        lr: 0.0001
        warmup_steps: 2000
      model:
        variant: summary_memory
        hierarchical_memory: true
        memory_aggregation: max
        memory_slots: 16   # use the proven slot count

    # 6. dual_lr with conservative memory_lr. Original (1e-3) and salvage
    # (5e-4) both diverged. 1e-4 is below the backbone LR — slow memory
    # rather than fast. If still bad, dual_lr likely just doesn't help here.
    - name: s3_hier_max_dual_lr_safer
      training:
        optimizer: adamw
        memory_lr: 0.0001
      model:
        variant: summary_memory
        hierarchical_memory: true
        memory_aggregation: max
        memory_slots: 16
